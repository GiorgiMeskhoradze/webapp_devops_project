apiVersion: apps/v1
kind: Deployment 
metadata:
  name: react-app 
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
        - name: react-app
          image: 427064007409.dkr.ecr.eu-central-1.amazonaws.com/devops-project-cluster-react-app:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"